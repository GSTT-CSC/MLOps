# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
# TODO: Currently runs at the same time as pull_request_test, consider combining?

name: CLI test

on:
  pull_request:

jobs:
  cli_test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.10' ]

    env:
      POSTGRES_DB: mlflow
      POSTGRES_USER: msdndfvk
      POSTGRES_PASSWORD: adfg3245
      MLFLOW_TRACKING_URI: http://0.0.0.0:85

    steps:
    - uses: actions/checkout@v2
      with:  # required for GitPython checks https://github.com/actions/checkout/issues/124
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Clear runner space
      run: |
        rm -rf /opt/hostedtoolcache

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install csc-mlops
      run: |
        python -m pip install --upgrade pip build
        python -m build 
        python -m pip install dist/*.whl

    - name: load MLflow storage paths
      run: |
        grep -E '^MLFLOW_(DB|ARTIFACTS)_PATH=' mlflow_server/default.env >> "$GITHUB_ENV"

    - name: start MLOps server
      # --wait blocks until all services are healthy or completed before returning.
      run: |
        sudo mkdir -p "$MLFLOW_DB_PATH" "$MLFLOW_ARTIFACTS_PATH"
        docker compose -f mlflow_server/docker-compose.yml up -d --build --wait

    - name: Test run CLI
      run: |
        cd tests/data
        mlops run test_entry.py -c test_config.cfg --ignore_git_check
        cd -